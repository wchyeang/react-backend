# =============================================================================
# docker-compose.ci.yml — CI/CD 构建覆盖文件
# 用法: docker compose -f docker-compose.yml -f docker-compose.ci.yml build
# =============================================================================

services:
  frontend:
    build:
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
      # 禁用构建缓存，保证每次基于最新依赖
      no_cache: true
    # CI 中不映射端口，避免冲突
    ports: []