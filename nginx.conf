# =============================================================================
# Nginx 生产环境配置 — React 后台管理 SPA
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# nginx master 以 root 启动绑定 80 端口，worker 进程降权到 nginxuser
user nginxuser;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # 日志格式（包含请求耗时、上游响应时间、真实客户端 IP）
    # ---------------------------------------------------------------------------
    log_format main escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # 性能优化
    # ---------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;                    # 隐藏 Nginx 版本号

    # ---------------------------------------------------------------------------
    # Gzip 压缩
    # ---------------------------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # 安全头（定义在 http 块作为兜底，server / location 可覆盖）
    # 注意：Nginx 子级 add_header 会覆盖父级全部 add_header，因此需要在
    #       关键 location（/ 和 /api/）中显式复述安全头。
    # ---------------------------------------------------------------------------

    # ---------------------------------------------------------------------------
    # 上传大小限制（按需调整）
    # ---------------------------------------------------------------------------
    client_max_body_size 20m;

    # ===========================================================================
    # Server Block
    # ===========================================================================
    server {
        listen 80;
        server_name _;

        root   /usr/share/nginx/html;
        index  index.html;

        # -------------------------------------------------------------------
        # 安全头 — server 级别，无 add_header 的 location 自动继承
        # -------------------------------------------------------------------
        add_header X-Frame-Options           "SAMEORIGIN"    always;
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-XSS-Protection          "1; mode=block"  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # -----------------------------------------------------------------------
        # 静态资源 — 带哈希的 JS/CSS/字体/图片（长期缓存）
        # -----------------------------------------------------------------------
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires                        1y;
            add_header Cache-Control       "public, immutable";
            add_header Vary                "Accept-Encoding";
            access_log                     off;
        }

        # -----------------------------------------------------------------------
        # favicon / robots.txt 等根路径文件
        # -----------------------------------------------------------------------
        location = /favicon.svg {
            expires         7d;
            add_header      Cache-Control "public";
            access_log      off;
        }

        location = /favicon.ico {
            expires         7d;
            add_header      Cache-Control "public";
            access_log      off;
        }

        location = /robots.txt {
            expires         7d;
            add_header      Cache-Control "public";
            access_log      off;
        }

        # -----------------------------------------------------------------------
        # API 反向代理（开发时 Vite proxy → 生产时 Nginx proxy）
        # 后端地址通过环境变量注入，默认为 localhost:8080
        # -----------------------------------------------------------------------
        location /api/ {
            # 使用 resolver + set 支持变量化 upstream，避免 Nginx 启动时 DNS 解析失败
            set $backend "backend:8080";
            proxy_pass                          http://$backend/api/;

            proxy_http_version                  1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       "upgrade";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout               5s;
            proxy_read_timeout                  30s;
            proxy_send_timeout                  30s;

            # 不缓存 API 响应
            add_header          Cache-Control   "no-store, no-cache, must-revalidate";
            # 安全头：因 add_header 会覆盖父级，此处显式复述
            add_header X-Frame-Options           "SAMEORIGIN"    always;
            add_header X-Content-Type-Options    "nosniff"        always;
            add_header X-XSS-Protection          "1; mode=block"  always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            expires             off;
        }

        # -----------------------------------------------------------------------
        # SPA 前端路由回退 — 所有非文件请求回到 index.html
        # -----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
            # 安全头：因 add_header 会覆盖父级，此处显式复述
            add_header X-Frame-Options           "SAMEORIGIN"    always;
            add_header X-Content-Type-Options    "nosniff"        always;
            add_header X-XSS-Protection          "1; mode=block"  always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        }

        # -----------------------------------------------------------------------
        # 健康检查端点（Kubernetes / 负载均衡探测）
        # -----------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}